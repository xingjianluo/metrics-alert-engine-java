spring.application.name=metrics-alert-engine-java
server.port=8080

# 引擎演示日志：记录写入拒绝、容量丢弃、状态迁移与通知
logging.level.com.github.xingjianluo=INFO
logging.level.ALERT-TEST=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} -- %msg%n

# 模型类使用 record 风格 x() 访问器而非 getX()，让 Jackson 直接按字段序列化
spring.jackson.visibility.field=any
spring.jackson.visibility.getter=none
spring.jackson.visibility.is-getter=none
