spring.application.name=metrics-alert-engine

# ===== 指标引擎容量与语义配置（前缀 metrics.engine）=====
# 单指标允许的标签组合（时间线）数量上限，超出 -> CARDINALITY_LIMIT
metrics.engine.max-series-per-metric=1000
# 全局时间线数量上限，超出 -> CARDINALITY_LIMIT
metrics.engine.max-total-series=10000
# 单条时间线内存保留的最大点数，超出按 FIFO 淘汰最旧点（不拒绝写入）
metrics.engine.max-points-per-series=20000
# 数据保留时长（毫秒），早于 now-retention 的数据在淘汰周期被清除
metrics.engine.retention-millis=86400000
# 允许的未来时间戳容差（毫秒），超出 -> TIMESTAMP_OUT_OF_RANGE
metrics.engine.future-tolerance-millis=60000
# 写入缓冲队列容量；消费过慢导致队列满时立即拒绝新写入 -> QUEUE_FULL（不反压调用方）
metrics.engine.ingest-queue-capacity=10000
# 过期数据淘汰周期（毫秒）
metrics.engine.eviction-interval-millis=300000
